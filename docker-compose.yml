version: "3.9"

services:
  backend:
    build: .
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - database

  database:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: botuser
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_DB: restaurant_bot
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
